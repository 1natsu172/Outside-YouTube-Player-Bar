name: Run Tests

on:
  workflow_call:
    inputs:
      production:
        description: "Run tests in production mode (strict knip validation)"
        type: string
        default: "false"
        required: false
  workflow_dispatch:
    inputs:
      production:
        description: "Run tests in production mode (strict knip validation)"
        type: choice
        default: "false"
        required: false
        options:
          - "true"
          - "false"
  pull_request:

env:
  # Use as process.env.SENTRY_AUTH_TOKEN with sentry-vite-plugin
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Run tests
        run: pnpm run test

  formatlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Run formatlint
        run: pnpm run formatlint

  knip:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Run Knip (development)
        if: inputs.production != 'true'
        run: pnpm knip
      - name: Run Knip (production strict)
        if: inputs.production == 'true'
        run: pnpm knip --production --strict
